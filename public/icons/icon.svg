<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>BlurMyScreen</title>
  <desc>An edge-to-edge sage-green webpage with frosted content and no outer padding.</desc>
  <defs>
    <clipPath id="page"><rect width="128" height="128" rx="24"/></clipPath>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bfd2c0"/>
      <stop offset="1" stop-color="#e0e8d9"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#page)">
    <rect width="128" height="128" fill="#2d493b"/>
    <rect x="10" y="40" width="108" height="78" rx="8" fill="#fbf9f6"/>
    <g fill="#fbf9f6">
      <circle cx="24" cy="20" r="6"/>
      <circle cx="44" cy="20" r="6" opacity=".8"/>
      <circle cx="64" cy="20" r="6" opacity=".6"/>
    </g>
    <rect x="26" y="56" width="54" height="8" rx="4" fill="#829b80"/>
    <rect x="26" y="76" width="66" height="8" rx="4" fill="#b5c5b0"/>
    <rect x="26" y="96" width="42" height="8" rx="4" fill="#cbd6c5"/>
    <rect x="42" y="70" width="86" height="40" rx="10" fill="url(#frost)" fill-opacity=".96"/>
    <g fill="#52745e">
      <rect x="56" y="80" width="50" height="6" rx="3" opacity=".45"/>
      <rect x="56" y="92" width="58" height="6" rx="3" opacity=".25"/>
    </g>
  </g>
</svg>
